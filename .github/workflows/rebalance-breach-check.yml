name: Rebalance breach check

# Real, unattended trigger for the assurance pool's automatic rebate path:
# every 30 minutes, hit the deployed app's authenticated cron endpoint,
# which checks every real agent's actual assurance-band status and pays a
# real, per-hire rebate from the Altana pool session for any breached
# agent's unrebated hires. See src/lib/chain/bandBreach.ts and
# src/lib/chain/autoRebate.ts for what "breached" means and why, and
# src/app/api/cron/rebalance-check/route.ts for the endpoint itself.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      the deployed app's base URL, e.g. https://get-backstop.netlify.app
#   CRON_SECRET  must match the same-named env var set on the deployment

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Queue instead of running concurrently: a manual workflow_dispatch firing
# while the scheduled run is still in flight (or a scheduled run overlapping
# a previous one that ran long) is exactly the scenario the app-side rebate
# claim (src/lib/chain/hires.ts's claimRebate) is hardened against, but
# there's no reason to invite that race at the trigger level too when GitHub
# Actions can just serialize it for free. Not cancel-in-progress: a run
# already past the "pay" step should be allowed to finish, not be killed
# mid-payout.
concurrency:
  group: rebalance-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call the rebalance-check endpoint
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/rebalance-check"
